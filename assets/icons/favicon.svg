<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0e"/>
      <stop offset="52%" stop-color="#713247"/>
      <stop offset="100%" stop-color="#5fa9d4"/>
    </linearGradient>
    <linearGradient id="km" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0cdb9"/>
      <stop offset="48%" stop-color="#9bd1ef"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- V5-2 dark / burgundy / blue base -->
  <rect x="7" y="7" width="114" height="114" rx="29" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="28"
        fill="none" stroke="#9bd1ef" stroke-opacity=".42" stroke-width="2"/>

  <!-- Security orbit -->
  <circle cx="64" cy="64" r="48"
          fill="none" stroke="#e0cdb9" stroke-opacity=".22"
          stroke-width="1.5" stroke-dasharray="5 6"/>
  <circle cx="64" cy="64" r="41"
          fill="none" stroke="#9bd1ef" stroke-opacity=".18"
          stroke-width="1"/>

  <!-- KM -->
  <text x="64" y="76"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="45"
        font-weight="900"
        letter-spacing="-5"
        fill="url(#km)"
        filter="url(#glow)">KM</text>

  <!-- Security spark -->
  <circle cx="99" cy="30" r="3.5" fill="#e0cdb9"/>
  <circle cx="99" cy="30" r="7" fill="none"
          stroke="#e0cdb9" stroke-opacity=".25"/>
</svg>
